<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="灵感墙">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262B31" />
      <stop offset="1" stop-color="#15181C" />
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- 全幅底色（maskable 安全区内不放关键元素） -->
  <rect width="1024" height="1024" fill="url(#bg)" />
  <!-- 后层卡片，暗示「墙」上的多张卡片 -->
  <g transform="rotate(8 620 500)" opacity="0.42">
    <rect x="392" y="248" width="384" height="424" rx="56" fill="#F6F6F3" />
  </g>
  <!-- 前层白色卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="252" y="292" width="520" height="500" rx="64" fill="#FFFFFF" />
  </g>
  <!-- 卡片上的文字条 -->
  <rect x="328" y="392" width="268" height="36" rx="18" fill="#1E2227" opacity="0.88" />
  <rect x="328" y="466" width="376" height="36" rx="18" fill="#1E2227" opacity="0.55" />
  <rect x="328" y="540" width="320" height="36" rx="18" fill="#1E2227" opacity="0.38" />
  <!-- 绿色强调点（creatos 连接点绿） -->
  <circle cx="672" cy="410" r="34" fill="#2E9E6B" />
</svg>
